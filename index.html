<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Éducatif Meta Quest VR - Élèves</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        quest: {
                            blue: '#0064e0', purple: '#7b2cbf', cyan: '#00f2fe',
                            dark: '#080c14', panel: 'rgba(18, 24, 38, 0.75)', card: 'rgba(255, 255, 255, 0.05)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #080c14;
            background-image: 
                radial-gradient(at 15% 15%, rgba(123, 44, 191, 0.22) 0px, transparent 55%),
                radial-gradient(at 85% 20%, rgba(0, 100, 224, 0.22) 0px, transparent 55%),
                radial-gradient(at 50% 85%, rgba(0, 242, 254, 0.15) 0px, transparent 55%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #f1f5f9;
        }
        .glass-panel {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover, .glass-card:focus-within {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(0, 242, 254, 0.5);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 30px -5px rgba(0, 242, 254, 0.3);
        }
        .vr-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .vr-btn:active { transform: scale(0.95); }
        .text-gradient-cyan {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-100 min-h-screen flex flex-col pb-12 select-none">

    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b border-white/10 px-4 lg:px-8 py-3.5 mb-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-purple-600 flex items-center justify-center shadow-lg text-white text-2xl font-black">
                        <i class="fa-solid fa-vr-cardboard"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold tracking-wide text-white">
                            Espace <span class="text-gradient-cyan font-black">Élèves VR</span>
                        </h1>
                        <p class="text-xs text-slate-400">Portail pédagogique Meta Quest</p>
                    </div>
                </div>
                <div id="vr-clock-mobile" class="text-xs font-mono bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl text-cyan-300 md:hidden flex items-center gap-1.5">
                    <i class="fa-regular fa-clock"></i>
                    <span class="clock-text">00:00</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-96">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 text-lg">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Rechercher une ressource..." class="w-full pl-12 pr-10 py-3 rounded-2xl bg-white/5 border border-white/15 text-white placeholder-slate-400 text-base focus:outline-none focus:border-cyan-400">
                <button id="clearSearch" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <div id="vr-clock-desktop" class="hidden md:flex text-xs font-mono bg-white/5 border border-white/10 px-3.5 py-2.5 rounded-xl text-cyan-300 items-center gap-2">
                    <i class="fa-regular fa-clock text-cyan-400"></i>
                    <span class="clock-text">00:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 flex-1 w-full">
        <section class="glass-panel rounded-3xl p-6 mb-8 border border-white/10 relative overflow-hidden">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 relative z-10">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-300 text-2xl shrink-0">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white">Bienvenue dans votre espace d'apprentissage VR</h2>
                        <p class="text-sm text-slate-300">Pointez une ressource avec votre manette et appuyez sur la gâchette pour l'ouvrir.</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <button id="btnToggleFavoritesOnly" class="vr-btn flex-1 md:flex-none px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-200 text-xs font-semibold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-star text-amber-400"></i>
                        <span>Mes Favoris (<span id="favCount">0</span>)</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="mb-8 overflow-x-auto pb-2">
            <div class="flex items-center gap-2 min-w-max" id="categoryFilterContainer"></div>
        </section>

        <section>
            <div id="bookmarkGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center glass-panel rounded-3xl mt-4">
                <h3 class="text-xl font-bold text-white mb-1">Aucune ressource trouvée</h3>
                <button id="btnResetFilters" class="vr-btn mt-4 px-5 py-2.5 bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 rounded-xl text-sm font-semibold">
                    Réinitialiser les filtres
                </button>
            </div>
        </section>
    </main>

    <!-- SCRIPT APPLICATION -->
    <script>
        const DEFAULT_CATEGORIES = ['Toutes', 'Sciences & Espace', 'Histoire & Musées', 'SVT & Anatomie', 'WebXR & Démo', 'Vidéos 360°'];
        const DEFAULT_BOOKMARKS = [
            { id: '1', title: 'NASA Solar System Treks', url: 'https://trek.nasa.gov', category: 'Sciences & Espace', icon: '🚀', description: 'Exploration interactive 3D des surfaces de la Lune, de Mars et du système solaire.' },
            { id: '2', title: 'Musée du Louvre VR', url: 'https://www.louvre.fr', category: 'Histoire & Musées', icon: '🏛️', description: 'Visites virtuelles immersives des galeries et expositions du musée.' }
        ];

        // CONFIGURATION JSONBIN (Lecture seule publique)
        const binId = "6adb5c93ffd5d1605385a545";
        const readOnlyApiKey = "$2a$10$zoi1tAoV8BrOWIkBTJYdeuYeCvNGL8Wl.8CuX0J4qbOM5L2X2PH/u";

        let categories = [];
        let bookmarks = [];
        let studentFavorites = [];
        
        let currentCategory = 'Toutes';
        let searchQuery = '';
        let showFavoritesOnly = false;

        const bookmarkGrid = document.getElementById('bookmarkGrid');
        const emptyState = document.getElementById('emptyState');
        const categoryFilterContainer = document.getElementById('categoryFilterContainer');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearch');
        const favCountSpan = document.getElementById('favCount');

        window.addEventListener('DOMContentLoaded', async () => {
            await loadData();
            updateClock();
            setInterval(updateClock, 10000);
            renderCategories();
            renderBookmarks();
            setupEventListeners();
        });

        function updateClock() {
            const now = new Date();
            document.querySelectorAll('.clock-text').forEach(el => el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        }

        async function loadData() {
            studentFavorites = JSON.parse(localStorage.getItem('quest_edu_favs')) || [];

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
                    headers: { 'X-Access-Key': readOnlyApiKey }
                });
                if (response.ok) {
                    const json = await response.json();
                    categories = json.record.categories || DEFAULT_CATEGORIES;
                    bookmarks = json.record.bookmarks || DEFAULT_BOOKMARKS;
                    updateFavCount();
                    return;
                }
            } catch (e) { console.error("Erreur de chargement Cloud", e); }

            categories = [...DEFAULT_CATEGORIES];
            bookmarks = [...DEFAULT_BOOKMARKS];
            updateFavCount();
        }

        function updateFavCount() { favCountSpan.textContent = studentFavorites.length; }

        function renderCategories() {
            categoryFilterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = (cat === currentCategory) && !showFavoritesOnly;
                btn.className = `vr-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition-all border ${isActive ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white border-cyan-300/40' : 'bg-white/5 text-slate-300 border-white/10'}`;
                btn.innerHTML = `<span>${cat}</span>`;
                btn.addEventListener('click', () => {
                    showFavoritesOnly = false;
                    currentCategory = cat;
                    renderCategories();
                    renderBookmarks();
                });
                categoryFilterContainer.appendChild(btn);
            });
        }

        function renderBookmarks() {
            bookmarkGrid.innerHTML = '';
            const filtered = bookmarks.filter(item => {
                const isFav = studentFavorites.includes(item.id);
                if (showFavoritesOnly && !isFav) return false;
                const matchesCategory = currentCategory === 'Toutes' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.description.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            emptyState.classList.toggle('hidden', filtered.length > 0);
            emptyState.classList.toggle('flex', filtered.length === 0);

            filtered.forEach(item => {
                const isFavorite = studentFavorites.includes(item.id);
                const card = document.createElement('div');
                card.className = 'glass-card rounded-3xl p-5 flex flex-col justify-between relative';
                let iconHTML = `<span class="text-2xl">${item.icon || '🌐'}</span>`;
                if (item.icon && item.icon.startsWith('fa-')) iconHTML = `<i class="fa-brands ${item.icon} text-2xl text-cyan-400"></i>`;

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div class="w-12 h-12 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center">${iconHTML}</div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="toggleFavorite('${item.id}')" class="vr-btn p-2 rounded-xl bg-white/5 border border-white/10 ${isFavorite ? 'text-amber-400' : 'text-slate-500'}"><i class="${isFavorite ? 'fa-solid' : 'fa-regular'} fa-star text-sm"></i></button>
                                <span class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-300">${escapeHTML(item.category)}</span>
                            </div>
                        </div>
                        <h3 class="text-base font-bold text-white mb-1.5 line-clamp-1">${escapeHTML(item.title)}</h3>
                        <p class="text-slate-400 text-xs leading-relaxed line-clamp-2 mb-4">${escapeHTML(item.description || '')}</p>
                    </div>
                    <div class="flex items-center gap-2 pt-3 border-t border-white/5">
                        <a href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer" class="vr-btn flex-1 bg-cyan-500/20 text-cyan-300 font-bold py-2.5 px-4 rounded-xl text-center text-xs border border-cyan-500/30">Ouvrir en VR</a>
                    </div>
                `;
                bookmarkGrid.appendChild(card);
            });
        }

        window.toggleFavorite = function(id) {
            if (studentFavorites.includes(id)) studentFavorites = studentFavorites.filter(f => f !== id);
            else studentFavorites.push(id);
            localStorage.setItem('quest_edu_favs', JSON.stringify(studentFavorites));
            updateFavCount(); renderBookmarks();
        };

        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.trim(); renderBookmarks(); });
            document.getElementById('btnToggleFavoritesOnly').addEventListener('click', () => { showFavoritesOnly = !showFavoritesOnly; renderBookmarks(); });
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
    </script>
</body>
</html>
